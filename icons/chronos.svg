<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cfBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#141f36"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="cfBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="cfRibbon1" x1="12" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="42%" stop-color="#3b82f6"/>
      <stop offset="78%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cfRibbon2" x1="52" y1="20" x2="12" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="cfCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <filter id="cfShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="64" height="64" rx="18" fill="url(#cfBg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="url(#cfBorder)" stroke-width="1.5"/>

  <!-- Core Ambient Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#cfCoreGlow)"/>

  <!-- Chronometer Orbit Dash Rings -->
  <circle cx="32" cy="32" r="25.5" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- Kinetic Infinity Chronometer Loops -->
  <g filter="url(#cfShadow)">
    <!-- Base Infinity Path -->
    <path d="M32 32 C25 22 16 22 11.5 26.5 C7 31 7 37 11.5 41.5 C16 46 25 41 32 32 C39 23 48 18 52.5 22.5 C57 27 57 33 52.5 37.5 C48 42 39 42 32 32" 
          stroke="url(#cfRibbon1)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 3D Overpass Ribbon Weave -->
    <path d="M23 26 C26.5 29.5 29.5 32 32 32 C35 32 38.5 29 42 25 C46.5 20 51 19 53 23" 
          stroke="url(#cfRibbon2)" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Flow Celestial Beacon / Active Pulse -->
  <circle cx="49" cy="20" r="3.6" fill="#38bdf8"/>
  <circle cx="49" cy="20" r="1.8" fill="#ffffff"/>
</svg>
